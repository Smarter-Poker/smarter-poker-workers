name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck + Lint + Test + Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install deps
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint || echo "::warning::lint reported issues"
        # Lint advisory at 2B.1 scaffold — flip to blocking in 2B.2 once rules are stable

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Dockerfile sanity — parse only, no build
        run: |
          # Parse Dockerfile with BuildKit's frontend (no actual image build)
          docker buildx build --file Dockerfile --check . 2>&1 | tail -20 || \
            echo "::warning::BuildKit check not available on this runner — skipping"
