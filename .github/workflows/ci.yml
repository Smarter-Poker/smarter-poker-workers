name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck + Lint + Test + Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install deps
        run: npm install --no-audit --no-fund --legacy-peer-deps

      # The weekly settlement's problem notices must never reach the owner
      # account's inbox or phone; that copy goes to operational_alert_events.
      # Named, and run before the full suite, so an unrelated red test or type
      # error cannot hide it on a pull request that touches auto-settlement.ts
      # or its routing helpers. vitest takes each name as a filter, so a renamed
      # or deleted file would silently match nothing while the others pass:
      # every file must exist before the run. The two route files build their
      # fake from auto-settlement.owner-routing.harness.ts, so without it
      # neither loads and the run fails.
      - name: Owner settlement notices reach Production Alerts, never the owner inbox
        run: |
          set -eu
          files="src/routes/auto-settlement.owner-routing.test.ts src/routes/auto-settlement.owner-inbox.test.ts src/lib/ownerOperationalRouting.test.ts src/lib/unionSettlementAlerts.test.ts"
          for file in $files; do
            if [ ! -f "$file" ]; then
              echo "::error file=$file::regression test file is missing"
              exit 1
            fi
          done
          npx vitest run $files

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint || echo "::warning::lint reported issues"
        # Lint advisory at 2B.1 scaffold — flip to blocking in 2B.2 once rules are stable

      - name: Unit tests
        run: npm test

      - name: Integrity scan memory and equivalence regression
        run: npm run test:integrity-memory

      - name: Build
        run: npm run build

      - name: Dockerfile sanity — parse only, no build
        run: |
          # Parse Dockerfile with BuildKit's frontend (no actual image build)
          docker buildx build --file Dockerfile --check . 2>&1 | tail -20 || \
            echo "::warning::BuildKit check not available on this runner — skipping"
