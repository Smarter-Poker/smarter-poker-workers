# ─────────────────────────────────────────────────────────────────────────────
# AGENT OPEN PR — trusted consumer of an unprivileged branch proposal signal.
#
# `workflow_run` executes this file from the default branch. The upstream
# signal has contents:read only and never receives a credential. This consumer
# validates the repository and branch metadata, mints a short-lived GitHub App
# token, and performs one idempotent operation: open the missing pull request.
# Native pull_request_target then invokes Agent Autopilot. No sweep or fallback
# token is needed.
# ─────────────────────────────────────────────────────────────────────────────
name: Agent Open PR

on:
  workflow_run:
    workflows: ['Agent Branch Proposal']
    types: [completed]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: agent-open-pr-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  open-pr:
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_repository.full_name == github.repository
      && github.event.workflow_run.head_branch != github.event.repository.default_branch
      && !startsWith(github.event.workflow_run.head_branch, 'backup/')
      && !startsWith(github.event.workflow_run.head_branch, 'ci-marker/')
      && !startsWith(github.event.workflow_run.head_branch, 'build/')
      && !startsWith(github.event.workflow_run.head_branch, 'dependabot/')
      && !startsWith(github.event.workflow_run.head_branch, 'preview/')
      && !startsWith(github.event.workflow_run.head_branch, 'renovate/')
      && !startsWith(github.event.workflow_run.head_branch, 'revert-')
    name: Open the missing PR for this branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout reviewed default-branch automation
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1

      - name: Mint the GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.AUTOPILOT_APP_ID }}
          private-key: ${{ secrets.AUTOPILOT_APP_PRIVATE_KEY }}

      - name: Open the pull request if it is missing
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          SIGNAL_SHA: ${{ github.event.workflow_run.head_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          [[ "$SIGNAL_SHA" =~ ^[0-9a-f]{40}$ ]] \
            || { echo '::error::Branch proposal did not carry one lowercase full SHA.'; exit 1; }

          EXISTING=$(gh pr list --repo "$REPO" --head "$BRANCH" --state open \
            --json number --jq 'length')
          if [ "$EXISTING" != "0" ]; then
            echo "A PR for $BRANCH is already open; no duplicate was created."
            exit 0
          fi

          AHEAD=$(gh api "repos/$REPO/compare/${DEFAULT_BRANCH}...${BRANCH}" --jq '.ahead_by')
          if [ "$AHEAD" = "0" ]; then
            echo "$BRANCH has no commit beyond $DEFAULT_BRANCH; nothing to propose."
            exit 0
          fi

          TITLE=$(gh api "repos/$REPO/commits/$SIGNAL_SHA" \
            --jq '.commit.message | split("\n")[0]')
          [ -n "$TITLE" ] || TITLE="Propose $BRANCH"
          gh pr create --repo "$REPO" --head "$BRANCH" --base "$DEFAULT_BRANCH" \
            --title "$TITLE" \
            --body "Opened by the reviewed Agent Open PR workflow from branch proposal signal $SIGNAL_SHA. Required checks and protected squash auto-merge remain authoritative."
