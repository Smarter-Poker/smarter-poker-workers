# ─────────────────────────────────────────────────────────────────────────────
# AUTO-DEPLOY WORKERS ON MERGE (2026-09-03)
#
# Until today this repo had no deploy path a merge could reach. release.yml
# builds an image on a v* tag and then tells a human to run
# scripts/deploy-workers.sh from Dan's Mac. The last tag was 2026-08-20; on
# 2026-09-03 the VM was running 2026-08-31's build while main carried
# thirteen newer commits, one of which was the /cron/cron-staleness-watchdog
# route that the Hetzner dispatcher had been calling into a 404 every fifteen
# minutes for thirty hours. Merged, tested, and not running is the failure
# this estate exists to prevent (AGENT-PLAYBOOK).
#
# This is scripts/deploy-workers.sh --build-on-server, run by CI on every
# merge that touches the service: git archive -> tarball to the VM -> docker
# build on the VM with the commit sha as the image revision label -> compose
# up -> /health -> the running container must report THIS sha or the run
# fails. The GHCR path is not used: it has returned 401 since 2026-08-18.
#
# Credentials: WORKERS_SSH_PRIVATE_KEY is the workers-deploy@smarter.poker
# key the VM already trusts (the same key deploy-workers.sh uses from the
# Mac). WORKERS_HOST_KEY pins the VM's ed25519 host key so a fresh runner
# never trusts-on-first-use.
# ─────────────────────────────────────────────────────────────────────────────
name: Auto-Deploy Workers (on merge)

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'Dockerfile'
      - 'docker-compose.yml'
  workflow_dispatch:
    inputs:
      run_sports_scrape:
        description: 'After exact-SHA deployment, run one ordinary sports clip refresh'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: auto-deploy-workers
  cancel-in-progress: false

jobs:
  deploy:
    name: Build on the VM and cut over
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Refuse a sports refresh outside protected main
        if: github.event_name == 'workflow_dispatch' && inputs.run_sports_scrape == true
        env:
          REQUEST_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$REQUEST_REF" != 'refs/heads/main' ]; then
            echo '::error::the one-shot sports refresh may run only from protected main'
            exit 1
          fi

      - name: Install the deploy key and pin the host key
        env:
          KEY: ${{ secrets.WORKERS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.WORKERS_HOST_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/workers_ed25519
          chmod 600 ~/.ssh/workers_ed25519
          printf '%s\n' "$HOST_KEY" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Ship the tree, build on the VM, cut over, verify the revision
        env:
          HOST: ${{ secrets.WORKERS_HOST }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Graceful container drain can be silent for several minutes. Keep
          # the SSH transport alive so a successful cutover is not reported
          # as a lost acknowledgement by the runner.
          SSH="ssh -i $HOME/.ssh/workers_ed25519 -o BatchMode=yes -o ConnectTimeout=25 -o ServerAliveInterval=30 -o ServerAliveCountMax=20 root@$HOST"
          SHORT=${SHA:0:11}
          IMAGE=ghcr.io/smarter-poker/smarter-poker-workers
          SERVICE=smarter-poker-workers

          echo "::group::Ship tree $SHORT"
          git archive --format=tar HEAD | $SSH 'rm -rf /opt/workers-build && mkdir -p /opt/workers-build && tar -x -C /opt/workers-build'
          echo "::endgroup::"

          echo "::group::Build on the VM"
          $SSH "cd /opt/workers-build && docker build --build-arg GIT_SHA=$SHA --label org.opencontainers.image.revision=$SHORT -t $IMAGE:latest . >/tmp/workers-build.log 2>&1 && echo BUILD_OK || { tail -40 /tmp/workers-build.log; exit 2; }"
          echo "::endgroup::"

          echo "::group::Cut over"
          # The live compose file predates the source stop_grace_period. Supply
          # the grace explicitly at cutover too, without replacing host config.
          $SSH "cd /opt/workers && sudo -u workers docker compose up -d --no-build --timeout 600"
          echo "::endgroup::"

          echo "::group::Verify"
          for i in $(seq 1 12); do
            REV=$($SSH "docker inspect --format '{{index .Config.Labels \"org.opencontainers.image.revision\"}}' \$(docker ps -q --filter name=$SERVICE | head -1) 2>/dev/null" || echo "")
            HEALTH=$($SSH 'curl -fsS -m 3 http://127.0.0.1:8081/health 2>/dev/null || echo ""')
            if [ "$REV" = "$SHORT" ] \
              && printf '%s' "$HEALTH" | grep -q '"status":"ok"' \
              && printf '%s' "$HEALTH" | grep -q "\"version\":\"$SHA\""; then
              echo "running $REV, healthy: $HEALTH"
              echo "### Workers deployed" >> "$GITHUB_STEP_SUMMARY"
              echo "Revision \`$SHA\` is running on the VM and /health reports that exact revision." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo "::error::the container reports revision '$REV' (wanted $SHORT); health: $HEALTH"
          $SSH "docker logs $SERVICE --tail 60 2>&1 || true"
          exit 1
          echo "::endgroup::"

      - name: Run one exact-revision sports clip refresh
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.run_sports_scrape == true
        env:
          HOST: ${{ secrets.WORKERS_HOST }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          SSH="ssh -i $HOME/.ssh/workers_ed25519 -o BatchMode=yes -o ConnectTimeout=25 -o ServerAliveInterval=30 -o ServerAliveCountMax=20 root@$HOST"
          SHORT=${SHA:0:11}
          SERVICE=smarter-poker-workers

          # Re-prove the serving revision in this guarded step. A successful
          # deployment step from another revision is not authority to mutate.
          REV=$($SSH "docker inspect --format '{{index .Config.Labels \"org.opencontainers.image.revision\"}}' \$(docker ps -q --filter name=$SERVICE | head -1) 2>/dev/null")
          HEALTH=$($SSH 'curl -fsS -m 3 http://127.0.0.1:8081/health')
          [ "$REV" = "$SHORT" ]
          printf '%s' "$HEALTH" | grep -q '"status":"ok"'
          printf '%s' "$HEALTH" | grep -q "\"version\":\"$SHA\""

          # One request, no retry. The client runs inside the already-loaded
          # container so CRON_SECRET is read from process.env and never copied
          # into the workflow, host shell, command line, or retained receipt.
          set +e
          RESPONSE=$($SSH "docker exec $SERVICE node -e 'fetch(\"http://127.0.0.1:8081/cron/scrape-sports-clips\",{method:\"POST\",headers:{Authorization:\"Bearer \"+process.env.CRON_SECRET},signal:AbortSignal.timeout(285000)}).then(async r=>{const body=await r.text();if(!r.ok)throw new Error(\"HTTP \"+r.status);process.stdout.write(body)}).catch(e=>{console.error(\"sports scrape request failed: \"+e.message);process.exit(1)})'")
          REQUEST_EXIT=$?
          set -e
          if [ "$REQUEST_EXIT" -ne 0 ]; then
            EXPECTED_SHA="$SHA" FAILURE_CODE='request_failed' node <<'NODE'
          const fs = require('node:fs');
          fs.writeFileSync('sports-scrape-receipt.json', `${JSON.stringify({
            schemaVersion: 1,
            deployedSha: process.env.EXPECTED_SHA,
            validation: 'failed',
            failureCode: process.env.FAILURE_CODE,
          }, null, 2)}\n`);
          NODE
            exit "$REQUEST_EXIT"
          fi

          RAW_RESPONSE="$RESPONSE" EXPECTED_SHA="$SHA" node <<'NODE'
          const fs = require('node:fs');
          const receiptPath = 'sports-scrape-receipt.json';
          const integerFields = [
            'channels_scraped', 'channels_with_clips', 'found', 'saved', 'skipped', 'repaired', 'failed',
            'rejected_missing_title', 'oembed_fallbacks_attempted',
            'oembed_fallbacks_resolved',
          ];
          const writeReceipt = (value, validation, failureCode = null) => {
            const integer = (field) => Number.isSafeInteger(value?.[field]) && value[field] >= 0
              ? value[field]
              : null;
            const timestamp = typeof value?.timestamp === 'string' && value.timestamp.length <= 64
              ? value.timestamp
              : null;
            const receipt = {
              schemaVersion: 1,
              deployedSha: process.env.EXPECTED_SHA,
              validation,
              failureCode,
              success: value?.success === true,
              dryRun: value?.dry_run === true,
              timestamp,
              channelsScraped: integer('channels_scraped'),
              channelsWithClips: integer('channels_with_clips'),
              found: integer('found'),
              saved: integer('saved'),
              skipped: integer('skipped'),
              repaired: integer('repaired'),
              failed: integer('failed'),
              rejectedMissingTitle: integer('rejected_missing_title'),
              oembedFallbacksAttempted: integer('oembed_fallbacks_attempted'),
              oembedFallbacksResolved: integer('oembed_fallbacks_resolved'),
            };
            fs.writeFileSync(receiptPath, `${JSON.stringify(receipt, null, 2)}\n`);
          };
          const reject = (value, failureCode, message) => {
            writeReceipt(value, 'failed', failureCode);
            throw new Error(message);
          };
          let value;
          try {
            value = JSON.parse(process.env.RAW_RESPONSE ?? '');
          } catch {
            reject({}, 'malformed_json', 'sports scrape returned malformed JSON');
          }
          if (value?.success !== true || value?.dry_run !== false) {
            reject(value, 'unsuccessful_response', 'sports scrape did not report an ordinary successful run');
          }
          for (const field of integerFields) {
            if (!Number.isSafeInteger(value[field]) || value[field] < 0) {
              reject(value, 'invalid_counters', `sports scrape returned invalid ${field}`);
            }
          }
          if (value.found < 1 || value.failed !== 0) {
            reject(value, 'empty_or_failed', 'sports scrape returned no usable clips or persistence failures');
          }
          if (value.saved + value.skipped + value.repaired !== value.found) {
            reject(value, 'counter_mismatch', 'sports scrape counters do not reconcile');
          }
          writeReceipt(value, 'passed');
          NODE

          {
            echo '### Sports clip refresh'
            echo "Exact deployed revision \`$SHA\` completed one ordinary refresh."
            echo 'The retained artifact contains counters only; no token, title, URL, or raw response is retained.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Retain sanitized sports refresh receipt
        if: always() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.run_sports_scrape == true
        uses: actions/upload-artifact@v4
        with:
          name: sports-scrape-receipt-${{ github.sha }}
          path: sports-scrape-receipt.json
          if-no-files-found: error
          retention-days: 14
